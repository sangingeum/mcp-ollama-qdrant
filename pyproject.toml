[project]
name = "mcp-ollama-qdrant"
version = "0.1.0"
description = "MCP server: Ollama embeddings + Qdrant vector memory"
readme = "README.md"
authors = [
    { name = "sangingeum", email = "sangingeum@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp[cli]<2",
    "numpy<2",
    "ollama>=0.6.2",
    "qdrant-client<1.15",
]

[project.scripts]
mcp-ollama-qdrant = "mcp_ollama_qdrant:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
